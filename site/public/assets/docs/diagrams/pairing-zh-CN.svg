<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>配对与连接的顺序</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#557a68"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8f6"/><text x="40" y="36" font-family="system-ui,sans-serif" font-size="19" fill="#17392a">配对与连接的顺序</text><path d="M400.0 135 L400.0 165" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M400.0 235 L400.0 265" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M400.0 335 L400.0 365" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M400.0 435 L400.0 465" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="70" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">主机准备可达连接 → 生成短期 claim</text><rect x="40.0" y="170" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">客户端扫码 / 导入 → 核对目标身份</text><rect x="40.0" y="270" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">daemon 签发绑定该客户端的 grant</text><rect x="40.0" y="370" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="397" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">客户端保存 endpoint 与凭据引用</text><rect x="40.0" y="470" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="497" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">后续连接 → 验证身份和 grant → 访问任务</text></svg>