<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img"><title>Agent 完成远端任务</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#557a68"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8f6"/><text x="40" y="36" font-family="system-ui,sans-serif" font-size="19" fill="#17392a">Agent 完成远端任务</text><path d="M400.0 135 L400.0 165" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M400.0 235 L400.0 265" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M400.0 335 L400.0 365" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M400.0 435 L400.0 465" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="70" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">Agent 所在环境</text><text x="400.0" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">检查 CLI、endpoint 与授权</text><rect x="40.0" y="170" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">通过 CLI 创建远端 Terminal</text><text x="400.0" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">命令与目录属于目标主机</text><rect x="40.0" y="270" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">等待 / 观察 / 人工接管</text><text x="400.0" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">超时不等于停止，运行不等于就绪</text><rect x="40.0" y="370" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="397" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">检查程序退出码与输出</text><text x="400.0" y="418" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">CLI 成功不等于任务成功</text><rect x="40.0" y="470" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="497" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">取回产物并交付结果</text><text x="400.0" y="518" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">设备、target、命令、状态、文件位置</text></svg>