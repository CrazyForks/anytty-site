<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img"><title>从电脑到手机，再回来</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#557a68"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f5f8f6"/><text x="40" y="36" font-family="system-ui,sans-serif" font-size="19" fill="#17392a">从电脑到手机，再回来</text><path d="M400.0 135 L400.0 165" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M400.0 235 L400.0 265" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><path d="M400.0 335 L400.0 365" fill="none" stroke="#557a68" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="70" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">电脑 TUI 创建任务</text><text x="400.0" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">主机保持运行</text><rect x="40.0" y="170" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">手机 App 配对并连接同一主机</text><text x="400.0" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">找到原 Terminal</text><rect x="40.0" y="270" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">查看输出 → 按需输入</text><text x="400.0" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">不重新创建同名任务</text><rect x="40.0" y="370" width="720.0" height="65" rx="8" fill="white" stroke="#8eaf9e"/><text x="400.0" y="397" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">回到电脑 → 打开原 Terminal</text><text x="400.0" y="418" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#17392a">继续同一个进程</text></svg>